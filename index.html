
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF QR Generator</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f6;
    text-align: center;
    padding: 30px;
}

.container {
    background: white;
    max-width: 450px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
}

input {
    max-width: 100%;
    margin: 20px 0;
}

button {
    background: #005b91;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    width: 100%;
    cursor: pointer;
    margin-top: 15px;
}

#qrcode {
    display: flex;
    justify-content: center;
    background: white;
    padding: 20px;
}
</style>
</head>

<body>

<div class="container">

<h2>PDF QR CODE GENERATOR</h2>

<input type="file" id="file" accept=".pdf">

<button onclick="generateQR()">
Generate QR Code
</button>

<p id="status"></p>

<div id="qrcode"></div>

<button onclick="downloadQR()">
Download QR Code
</button>

</div>

<script>

async function generateQR() {

    const file = document.getElementById("file").files[0];
    const status = document.getElementById("status");

    if (!file) {
        alert("Please select a PDF file");
        return;
    }

    const data = new FormData();
    data.append("file", file);

    status.textContent = "Uploading file...";

    try {

        const response = await fetch("/upload", {
            method: "POST",
            body: data
        });

        if (!response.ok) {
            throw new Error("Upload failed");
        }

        const result = await response.json();
        const url = new URL(result.url, location.origin);

        if (url.protocol !== "https:") {
            throw new Error("HTTPS document link required");
        }

        document.getElementById("qrcode").innerHTML = "";

        new QRCode(document.getElementById("qrcode"), {
            text: url.href,
            width: 250,
            height: 250
        });

        status.textContent = "QR Code Generated";

    } catch (error) {
        status.textContent =
        "Document server unavailable. Check hosting.";
    }
}

function downloadQR() {

    const canvas = document.querySelector("#qrcode canvas");

    if (!canvas) {
        alert("Generate QR code first");
        return;
    }

    const output = document.createElement("canvas");
    output.width = 310;
    output.height = 310;

    const ctx = output.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 310, 310);
    ctx.drawImage(canvas, 30, 30);

    const link = document.createElement("a");
    link.download = "Document-QR.png";
    link.href = output.toDataURL("image/png");
    link.click();
}

</script>

</body>
</html>

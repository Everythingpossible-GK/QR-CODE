
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF QR Code Generator</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f6;
    padding: 25px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
}

h2 {
    color: #003b70;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 15px;
    background: #005b91;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 8px 0;
    font-size: 15px;
}

button:hover {
    background: #003b70;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

#qrcode {
    display: flex;
    justify-content: center;
    padding: 25px;
}

#status {
    font-size: 14px;
}

.note {
    font-size: 13px;
    color: #666;
}

a {
    color: #005b91;
}
</style>
</head>

<body>

<div class="container">

<h2>PDF QR CODE GENERATOR</h2>

<p>Paste your Google Drive file link</p>

<input type="url" id="fileLink"
placeholder="https://drive.google.com/file/d/...">

<button onclick="generateQR()">
Generate QR Code
</button>

<p id="status"></p>

<div id="qrcode"></div>

<a id="viewLink" target="_blank"
rel="noopener noreferrer" hidden>
Open PDF Document
</a>

<button id="downloadButton"
onclick="downloadQR()" disabled>
Download QR Code
</button>

<button onclick="clearAll()">
Clear
</button>

<p class="note">
Ensure Google Drive sharing is set to
Anyone with the link - Viewer.
</p>

</div>

<script>

function generateQR() {

    const input = document.getElementById("fileLink");
    const status = document.getElementById("status");
    const qr = document.getElementById("qrcode");
    const viewLink = document.getElementById("viewLink");
    const download = document.getElementById("downloadButton");

    qr.innerHTML = "";
    viewLink.hidden = true;
    download.disabled = true;

    try {

        const url = new URL(input.value.trim());

        if (url.protocol !== "https:" ||
            url.hostname !== "drive.google.com") {
            throw new Error("Enter a valid Google Drive link.");
        }

        const match = url.pathname.match(
            /\/file\/d\/([a-zA-Z0-9_-]+)/
        );

        const id = match ? match[1] :
            url.searchParams.get("id");

        if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
            throw new Error("Invalid Google Drive file link.");
        }

        const directLink = new URL(
            "https://drive.google.com/file/d/" +
            id + "/view"
        );

        const resourceKey =
            url.searchParams.get("resourcekey");

        if (resourceKey) {
            directLink.searchParams.set(
                "resourcekey", resourceKey
            );
        }

        new QRCode(qr, {
            text: directLink.href,
            width: 280,
            height: 280,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        viewLink.href = directLink.href;
        viewLink.hidden = false;
        download.disabled = false;

        status.style.color = "green";
        status.textContent =
            "QR Code Generated Successfully!";

    } catch (error) {

        status.style.color = "red";
        status.textContent = error.message;
    }
}

function downloadQR() {

    const canvas =
        document.querySelector("#qrcode canvas");

    if (!canvas) {
        alert("Generate QR code first.");
        return;
    }

    const output = document.createElement("canvas");

    output.width = 360;
    output.height = 360;

    const ctx = output.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 360, 360);
    ctx.drawImage(canvas, 40, 40);

    const link = document.createElement("a");

    link.download = "PDF-QR-Code.png";
    link.href = output.toDataURL("image/png");
    link.click();
}

function clearAll() {

    document.getElementById("fileLink").value = "";
    document.getElementById("qrcode").innerHTML = "";
    document.getElementById("status").textContent = "";
    document.getElementById("viewLink").hidden = true;
    document.getElementById("downloadButton").disabled = true;
}

</script>

</body>
</html>
